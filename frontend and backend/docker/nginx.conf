# Serves the built CrimeNet bundle and proxies /api to the FastAPI service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Evidence uploads are multi-megabyte; the pipeline run POST itself is
    # small but its response can be slow, hence the read timeout.
    client_max_body_size 512m;

    # Docker's embedded DNS, re-checked on every request so a restarted API
    # container is picked up without reloading nginx. With a variable in
    # proxy_pass nginx forwards the original request URI unchanged, so
    # /api/cases/... still arrives at the API as /api/cases/....
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;

        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job polling is frequent and short; never buffer it.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # TanStack Router owns the URLs, so any deep link has to fall back to the
    # shell rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
